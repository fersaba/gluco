name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar
        run: npm run build
      - name: Los archivos generados deben estar al día
        run: |
          git diff --exit-code -- index.html sw.js assets dist publicar docs/hoja-imprimible.html || {
            echo "::error::Los archivos generados no coinciden con src/. Corré 'npm run build' y subí los cambios."
            exit 1
          }
      - name: Revisiones rápidas
        run: npm run check
      - name: Pruebas automáticas
        run: npm test
